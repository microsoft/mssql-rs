[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mssql-python-rs"
version = "0.1.0"
description = "Rust-based native runtime (TDS core and ODBC driver) consumed by the mssql-python driver."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Microsoft Corporation" }]
keywords = ["sqlserver", "azure-sql", "tds", "odbc", "mssql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/microsoft/mssql-python"
Source = "https://github.com/microsoft/mssql-rs"

[tool.maturin]
module-name = "mssql_py_core"
features = ["pyo3/extension-module"]
# Skip maturin's build-time auditwheel: the mssql-odbc driver is injected into
# the wheel after the build, so repair must run on the final wheel. The pipeline
# runs `auditwheel repair` post-injection (scripts/repair-glibc-wheels-in-container.sh)
# to resolve the native dependencies of both the extension and mssqlodbc.so and
# retag the glibc wheels manylinux_*. macOS (Security.framework) and Windows
# (SChannel) have no OpenSSL dependency.
auditwheel = "skip"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "python-dotenv>=1.0.0", "maturin>=1.0,<2.0"]
