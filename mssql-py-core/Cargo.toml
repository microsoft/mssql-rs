[package]
name = "mssql-py-core"
version = "0.1.9"
edition = "2024"
publish = false

[lib]
name = "mssql_py_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
mssql-tds = { path = "../mssql-tds" }
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
async-trait = "0.1"
anyhow = "1.0"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.4"
chrono = { version = "0.4", features = ["clock"] }
once_cell = "1.20"
rust_decimal = "1.36"
serde_json = "1.0"
uuid = "1.19"
arrow = { version = "55", default-features = false, features = ["ffi"] }

[build-dependencies]
pyo3-build-config = "0.29.0"

# Release profile: generate full debug info so the build pipeline can extract
# a separate .pdb / .debug / .dSYM for symbolication of customer crash dumps,
# while the shipped binary stays small. See work item 45990.
#
# - debug = "full": full DWARF / PDB info generated.
# - split-debuginfo = "packed": on macOS produces a .dSYM bundle; ignored on
#   Windows-MSVC which always emits a separate .pdb. Linux overrides this to
#   "off" via CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO in
#   scripts/build-python-wheels-in-container.sh — a .dwp is unusable once the
#   skeleton DWARF is stripped out of the shipped .so, so Linux instead uses
#   the conventional objcopy --only-keep-debug / --add-gnu-debuglink flow.
# - strip = "none": the linked artifact must keep its debug info so the
#   pipeline can split it out; stripping of the shipped .so happens after the
#   debug file has been extracted, with --strip-debug (keeps .symtab and the
#   GNU build-id) rather than --strip-all.
# - lto = true: mirrors the workspace release profile.
[profile.release]
lto = true
debug = "full"
split-debuginfo = "packed"
strip = "none"
