name: PR Code Coverage

# Reports diff (patch) coverage on pull requests, mirroring the diff-coverage
# check that ran in Azure DevOps before the move to GitHub.
#
# The build + tests + coverage still run in Azure DevOps (pipeline definition
# 2267 in sqlclientdrivers/public). This workflow polls the ADO REST API for
# the build associated with the PR, waits for the Cobertura coverage artifact
# published by that build, and runs `diff-cover` to compute coverage for the
# lines changed in the PR. The result is posted as a sticky PR comment.
# Each poll refreshes the latest build, including replacements after a push.
# Builds must match the current GitHub PR head, even before ADO queues a new run.
# Confirmed duplicate-validation skips reuse successful coverage for the same head.
# Checkout follows artifact selection so coverage and source use the same SHA.
#
# Triggers:
#   - Same-repo PRs run automatically on pull_request.
#   - Forked PRs do NOT run automatically (their head code is untrusted and the
#     pull_request token is read-only). Instead, a maintainer runs the check by
#     commenting `/coverage` on the PR. The issue_comment event runs in the
#     base-repo context. Reporting uses a read-only job and trusted tooling;
#     a separate job posts the result without checking out fork code.
# Same-repository contributors can edit the workflow itself and are trusted.
# Fork reports use only issue_comment's default-branch workflow revision.
#
# Reporting-only: diff-cover is run WITHOUT --fail-under, so this never blocks
# a merge for low coverage. Report-generation errors still fail the job.

on:
  pull_request:
    branches:
      - main
    # Mirror the ADO PR validation build policy path excludes so this coverage
    # report is skipped when that build is skipped (otherwise it fails waiting
    # for a build that never runs). The issue_comment `/coverage` path below is
    # unaffected and can still be used to run the report manually.
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'es-metadata.yml'
  issue_comment:
    types:
      - created

# Least-privilege default: grant no permissions at the workflow level.
# Each job opts into only the scopes it needs.
permissions: {}

# Comments are isolated until actual write permission is checked. Shared report
# concurrency is assigned only after authorization; associations are insufficient.
# Event names keep manual reports from canceling automatic PR checks.
concurrency:
  group: >-
    pr-coverage-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}${{ github.event_name == 'issue_comment' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    # Run automatically for same-repo PRs; for forked PRs, only when a
    # maintainer comments `/coverage`; verify actual write permission below.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/coverage') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.prctx.outputs.pr_number }}
    timeout-minutes: 5
    steps:
      - name: Determine PR context
        id: prctx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: context.payload.comment.user.login
              });
              if (!['admin', 'maintain', 'write'].includes(data.permission)) {
                throw new Error('/coverage requires repository write permission');
              }
            }
            const pr = context.payload.pull_request ?? (await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number
            })).data;
            if (!Number.isSafeInteger(pr.number) || pr.number <= 0) {
              throw new Error('Invalid PR number');
            }
            core.setOutput('pr_number', pr.number);

  coverage-report:
    needs: authorize
    runs-on: ubuntu-latest
    concurrency:
      group: pr-coverage-report-${{ needs.authorize.outputs.pr_number }}-${{ github.event_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ needs.authorize.outputs.pr_number }}
      head_sha: ${{ steps.build.outputs.head_sha }}
      report: ${{ steps.report.outputs.report }}
    # Build runs ~45 min in ADO; the artifact wait can take up to 1h15m.
    timeout-minutes: 120
    steps:
      - name: Checkout trusted reporting tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false

      - name: Setup reporting Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned reporting dependencies
        run: |
          python -I -m pip --isolated install --quiet --only-binary=:all: --require-hashes \
            -r tooling/.github/coverage-requirements.txt

      - name: Wait for latest ADO coverage artifact
        id: build
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I tooling/.github/scripts/wait-for-coverage.py \
            --pr-number "$PR_NUMBER" --output "$GITHUB_OUTPUT"

      - name: Download Cobertura coverage artifact
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          curl --location --proto '=https' --proto-redir '=https' \
            "https://dev.azure.com/sqlclientdrivers/public/_apis/build/builds/${BUILD_ID}/artifacts?api-version=7.1&artifactName=CoberturaCoverage&%24format=zip" \
            --output "$RUNNER_TEMP/coverage-artifact.zip" --fail --silent --show-error

      - name: Checkout coverage source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.build.outputs.head_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Setup git for diff-cover
        working-directory: source
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Run diff-cover
        id: report
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          python -I tooling/.github/scripts/coverage-report.py \
            --archive "$RUNNER_TEMP/coverage-artifact.zip" \
            --source "$GITHUB_WORKSPACE/source" --build-id "$BUILD_ID" \
            --output "$GITHUB_OUTPUT" --temp-dir "$RUNNER_TEMP"

  post-comment:
    needs: coverage-report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - name: Checkout trusted comment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify report head before posting
        id: head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.coverage-report.outputs.pr_number }}
          REPORT_HEAD_SHA: ${{ needs.coverage-report.outputs.head_sha }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const head = process.env.REPORT_HEAD_SHA;
            if (!Number.isSafeInteger(number) || number <= 0 || !/^[0-9a-f]{40}$/.test(head ?? '')) {
              throw new Error('Invalid coverage report PR number or head SHA');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: number
            });
            const current = pr.head.sha === head;
            core.setOutput('current', current);
            if (!current) {
              core.notice('PR head changed after coverage generation; skipping stale comment.');
            }
      - name: Comment coverage summary on PR
        if: steps.head.outputs.current == 'true'
        uses: ./.github/actions/post-coverage-comment
        with:
          pr_number: ${{ needs.coverage-report.outputs.pr_number }}
          coverage_percentage: ${{ fromJSON(needs.coverage-report.outputs.report).coverage_percentage }}
          patch_coverage_pct: ${{ fromJSON(needs.coverage-report.outputs.report).patch_coverage_pct }}
          patch_coverage_summary: ${{ fromJSON(needs.coverage-report.outputs.report).patch_coverage_summary }}
          ado_url: ${{ fromJSON(needs.coverage-report.outputs.report).ado_url }}
