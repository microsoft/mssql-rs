name: Bump Released Crate Versions

on:
  schedule:
    # The script checks every third UTC day, without resetting at month boundaries.
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump-released-crate-versions
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check published versions and create tracking issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.CRATE_VERSION_BUMP_TOKEN || github.token }}
        run: python3 scripts/bump-released-crate-versions.py

      - name: Create or update version bump PR
        if: steps.check.outputs.due == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CRATE_VERSION_BUMP_TOKEN || github.token }}
          branch: automation/bump-released-crate-versions
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            mssql-tds/Cargo.toml
            mssql-mock-tds/Cargo.toml
          commit-message: Bump released crates to the next minor version
          title: Bump released crates to the next minor version
          body-path: ${{ runner.temp }}/crate-version-bump-pr.md
          draft: always-true
