[package]
name = "mssql-adbc"
version = "0.1.0"
edition = "2024"
description = "Arrow Database Connectivity driver for SQL Server over native TDS"
license = "MIT"
repository = "https://github.com/microsoft/mssql-rs"
readme = "README.md"

[lib]
name = "adbc_driver_mssql"
crate-type = ["rlib", "cdylib"]

[features]
default = ["ffi"]
ffi = ["dep:adbc_ffi"]

[lints]
workspace = true

[dependencies]
adbc_core = "=0.25.0"
adbc_ffi = { version = "=0.25.0", optional = true }
arrow-array = { version = "60", features = ["ffi"] }
arrow-buffer = "60"
arrow-schema = "60"
mssql-tds = { path = "../mssql-tds" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }
tracing = "0.1.43"
url = "2"
uuid = "1.19"

[dev-dependencies]
adbc_driver_manager = "=0.25.0"
mssql-mock-tds = { path = "../mssql-mock-tds" }
dotenv = "0.15"

