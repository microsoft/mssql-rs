[package]
name = "mssql-odbc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mssqlodbc = { path = ".." }
arbitrary = { version = "1", features = ["derive"] }

# Keep this fuzz crate out of the parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "fuzz_connection_string"
path = "fuzz_targets/fuzz_connection_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_escape_sequences"
path = "fuzz_targets/fuzz_escape_sequences.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_numeric_parse"
path = "fuzz_targets/fuzz_numeric_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_datetime_parse"
path = "fuzz_targets/fuzz_datetime_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_read_utf16"
path = "fuzz_targets/fuzz_read_utf16.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_transcode"
path = "fuzz_targets/fuzz_transcode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fetch_convert"
path = "fuzz_targets/fuzz_fetch_convert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_bound_param"
path = "fuzz_targets/fuzz_bound_param.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ffi_execute"
path = "fuzz_targets/fuzz_ffi_execute.rs"
test = false
doc = false
bench = false
