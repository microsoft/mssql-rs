parameters:
  - name: installAzCli
    type: boolean
    default: false
    displayName: Install Azure CLI
  - name: installDocker
    type: boolean
    default: false
    displayName: Install Docker


steps:
- ${{ if eq(parameters.installAzCli, true) }}:
  - script: |
      set -e
      if command -v az &> /dev/null; then
          echo "Azure CLI is already installed"
      elif command -v tdnf &> /dev/null; then
          # The RUST-AZL3-ARM64 image does not ship az (the Ubuntu ARM64 image did).
          echo "Azure CLI not found, installing from the Azure Linux repo..."
          sudo tdnf install -y azure-cli
      else
          echo "ERROR: Az CLI is expected to be pre-installed in the build image. If this is a developer machine, then install az cli using \`curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash\`"
          exit 1
      fi
      az version
    displayName: Install Az CLI
    condition: succeeded()

- ${{ if eq(parameters.installDocker, true) }}:
  - script: |
      # Only ARM has ever needed this; the x64 images ship a docker daemon.
      # Gate on the DAEMON, not the CLI: callers run DockerInstaller@0 first, so
      # `command -v docker` is already true on a host with no daemon installed.
      ARCH=$(arch)
      if [ "$ARCH" = "aarch64" ] && ! sudo docker info >/dev/null 2>&1; then
          echo "Docker daemon not reachable, installing..."
          # moby-engine is dockerd only; the client comes from moby-cli.
          sudo tdnf install moby-engine moby-cli -y
          sudo systemctl enable --now docker
          sudo groupadd -f docker
          sudo usermod -aG docker $USER
      fi
      echo "Changing permissions for docker.sock"
      sudo chmod 666 /var/run/docker.sock
    displayName: Install Docker
    condition: succeeded()