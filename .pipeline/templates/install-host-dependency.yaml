parameters:
  - name: installAzCli
    type: boolean
    default: false
    displayName: Install Azure CLI
  - name: installDocker
    type: boolean
    default: false
    displayName: Install Docker


steps:
# The Azure Linux image is minimal and does not ship these; sql-host/start.sh
# needs hostname(1) or ip(8) to advertise the agent's private IPv4. Jobs that
# reach this template do not all run install-deps.sh.
- script: |
    missing=""
    command -v hostname >/dev/null 2>&1 || missing="$missing hostname"
    command -v ip >/dev/null 2>&1 || missing="$missing iproute"
    if [ -n "$missing" ]; then
      echo "Installing missing core utilities:$missing"
      sudo tdnf install -y $missing
    else
      echo "hostname and ip are already present"
    fi
  displayName: Ensure core network utilities
  condition: succeeded()

- ${{ if eq(parameters.installAzCli, true) }}:
  - script: |
      if ! command -v az &> /dev/null
      then
          echo "ERROR: Az CLI is expected to be pre-installed in the build image. If this is a developer machine, then install az cli using \`curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash\`"
          exit 1
      else
          echo "Azure CLI is already installed"
      fi
    displayName: Install Az CLI
    condition: succeeded()

- ${{ if eq(parameters.installDocker, true) }}:
  - script: |
      # Only ARM has ever needed this; the x64 images ship a docker daemon.
      ARCH=$(arch)
      if [ "$ARCH" = "aarch64" ] && ! command -v docker >/dev/null 2>&1; then
          echo "Docker not found, installing..."
          sudo tdnf install moby-engine moby-cli -y
          sudo systemctl enable --now docker
          sudo groupadd -f docker
          sudo usermod -aG docker $USER
      fi
      echo "Changing permissions for docker.sock"
      sudo chmod 666 /var/run/docker.sock
    displayName: Install Docker
    condition: succeeded()