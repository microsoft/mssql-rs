# Re-download the immutable selected build artifact in every job, never an
# intermediate artifact or a directory supplied by the registry-check agent.
# Sets crate version variables from the manifest for later steps in the same job.
parameters:
- name: requireMssqlRs
  type: boolean
  default: false

steps:
- download: officialBuild
  artifact: 'drop_Build_RustCrates'
  displayName: 'Download Rust crate artifacts'

- pwsh: >
    & "$(Build.SourcesDirectory)/.pipeline/scripts/validate-crate-release-artifact.ps1"
    -ArtifactDirectory "$(Pipeline.Workspace)/officialBuild/drop_Build_RustCrates"
    -RequireMssqlRs '${{ parameters.requireMssqlRs }}'
  displayName: 'Validate Rust crate release artifact'
  workingDirectory: '$(Build.SourcesDirectory)'
