# azl3-inventory-steps.yml
#
# TEMPORARY, see .pipeline/azl3-probe.yml. Read-only: installs nothing and
# changes nothing on the agent, so it is safe to point at a production image.
parameters:
  - name: label
    type: string

steps:
- script: |
    set +e
    echo "############ ${{ parameters.label }} ############"
    echo
    echo "---- identity ----"
    cat /etc/os-release 2>/dev/null | sed -n '1,6p'
    echo "arch:   $(uname -m)"
    echo "kernel: $(uname -r)"
    echo "glibc:  $(ldd --version 2>/dev/null | head -1)"
    echo
    echo "---- package managers ----"
    for c in tdnf dnf yum rpm apt-get dpkg apk; do
      printf '  %-10s %s\n' "$c" "$(command -v $c 2>/dev/null || echo MISSING)"
    done
    echo
    echo "---- tooling our pipeline expects on the HOST ----"
    for c in az docker git git-lfs python3 pip3 jq unzip wget curl sudo systemctl \
             rustup cargo pwsh make gcc cc ld pkg-config clang llvm-config; do
      printf '  %-14s %s\n' "$c" "$(command -v $c 2>/dev/null || echo MISSING)"
    done
    echo
    echo "---- versions of the ones that matter ----"
    echo "  az:       $(az version 2>/dev/null | head -3 | tr -d '\n' || echo n/a)"
    echo "  docker:   $(docker --version 2>/dev/null || echo n/a)"
    echo "  git:      $(git --version 2>/dev/null || echo n/a)"
    echo "  git-lfs:  $(git lfs version 2>/dev/null || echo n/a)"
    echo "  python3:  $(python3 --version 2>&1 || echo n/a)"
    echo "  pip3:     $(pip3 --version 2>&1 | head -1 || echo n/a)"
    echo
    echo "---- the three CVE packages ----"
    for p in git-lfs gss-ntlmssp python3-pip python3-setuptools; do
      if command -v rpm >/dev/null 2>&1; then
        printf '  %-18s %s\n' "$p" "$(rpm -q $p 2>/dev/null || echo 'not installed')"
      elif command -v dpkg >/dev/null 2>&1; then
        printf '  %-18s %s\n' "$p" "$(dpkg -s $p 2>/dev/null | awk -F': ' '/^Version:/{print $2}' || echo 'not installed')"
      fi
    done
    echo
    echo "---- outstanding security updates (is the image actually patched?) ----"
    if command -v tdnf >/dev/null 2>&1; then
      tdnf check-update 2>&1 | tail -30
    elif command -v apt-get >/dev/null 2>&1; then
      apt-get -s upgrade 2>/dev/null | grep -E '^Inst' | head -30
    fi
    echo
    echo "---- dev packages scripts/install-deps.sh installs on Ubuntu ----"
    echo "  (names differ on AZL3: build-essential -> gcc/make, libssl-dev ->"
    echo "   openssl-devel, libkrb5-dev -> krb5-devel)"
    for p in openssl-devel krb5-devel gcc make binutils; do
      if command -v rpm >/dev/null 2>&1; then
        printf '  %-18s %s\n' "$p" "$(rpm -q $p 2>/dev/null || echo MISSING)"
      fi
    done
    echo
    echo "---- scratch space (RUST-AZL3 is capped at diskSize 100 for the D2) ----"
    df -h / /mnt 2>/dev/null
    echo
    echo "---- can the host run a container at all? ----"
    docker info >/dev/null 2>&1 && echo "  docker daemon: reachable" || echo "  docker daemon: NOT reachable"
    echo
    echo "############ end ${{ parameters.label }} ############"
    exit 0
  displayName: 'Inventory: ${{ parameters.label }}'
