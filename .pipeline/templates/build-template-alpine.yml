parameters:
- name: osType  # defaults for any parameters that aren't specified
  default: Windows
  type: string
  values:
  - Windows
  - Linux
  - MacOS

- name: buildType
  displayName: Type of the build to produce
  type: string
  values:
  - Both
  - Debug
  - Release
  default: Both

- name: testFilter
  displayName: Optional Filter for tests
  type: string
  default: ''

- name: alpineimagetag
  displayName: Alpine Image Tag
  type: string
  default: 'ghcr.io/microsoft/mssql-rs/build/alpine:3.18'

steps:
- script: |
    echo "##vso[task.setvariable variable=ARCHIVE_NAME;isOutput=false]tdslib-nextest-musl.tar.zst"
  displayName: Set Archive file name 
  condition: succeeded()
  
- script: |
    bash .pipeline/scripts/docker-cargo-run.sh \
      -v "$PWD:/workspace" \
      -e "ARCHIVE_NAME=tdslib-nextest-musl.tar.zst" \
      ${{ parameters.alpineimagetag }} /workspace/scripts/dockerentry/alpine-build.sh
  displayName: Rust Alpine container build
  condition: succeeded()
  env:
    CARGO_REGISTRIES_MSSQL_RS_PUBLIC_TOKEN: $(CARGO_REGISTRIES_MSSQL_RS_PUBLIC_TOKEN)
    CARGO_REGISTRIES_MSSQL_RS_TOKEN: $(CARGO_REGISTRIES_MSSQL_RS_TOKEN)

# Only non-PR distro-matrix and full Kerberos tests consume this drop.
- script: |
    cp tdslib-nextest-musl.tar.zst "$(Build.ArtifactStagingDirectory)/"
  displayName: Copy musl nextest archive
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

- task: PublishBuildArtifacts@1
  displayName: Publish Build Drop
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: $(System.PhaseName)
    publishLocation: Container
