# Build the mssql-sqlcmd static library for one Linux target inside a wheel-build
# image and stage it under $(Build.SourcesDirectory)/mssql-sqlcmd-native in the
# NuGet package layout (runtimes/<rid>/native/). The image's host target is the
# one built, so no cross toolchain is needed.

parameters:
  # Wheel-build image whose Rust toolchain and libc the library is built with.
  - name: image
    type: string
  # Rust target triple, matching the image (e.g. x86_64-unknown-linux-musl).
  - name: target
    type: string
  # NuGet runtime identifier the library is staged under (e.g. linux-musl-x64).
  - name: rid
    type: string

steps:
  - script: |
      set -e
      # musllinux images ship no bash; the build script needs it.
      bash .pipeline/scripts/docker-cargo-run.sh --rm \
        -v "$PWD:/workspace" \
        -v "$HOME/.cargo/registry:/root/.cargo/registry" \
        -v "$HOME/.cargo/git:/root/.cargo/git" \
        -e CARGO_TARGET_DIR=/tmp/mssql-sqlcmd-target \
        -w /workspace \
        ${{ parameters.image }} \
        sh -c 'command -v bash >/dev/null 2>&1 || apk add --no-cache bash >/dev/null; bash .pipeline/scripts/build-mssql-sqlcmd-native.sh "$1" "$2" /workspace/mssql-sqlcmd-native' \
        sh ${{ parameters.target }} ${{ parameters.rid }}
    displayName: 'Build mssql-sqlcmd (${{ parameters.rid }})'
    env:
      CARGO_REGISTRIES_MSSQL_RS_PUBLIC_TOKEN: $(CARGO_REGISTRIES_MSSQL_RS_PUBLIC_TOKEN)
      CARGO_REGISTRIES_MSSQL_RS_TOKEN: $(CARGO_REGISTRIES_MSSQL_RS_TOKEN)
