# Template for running mssql-python tests on macOS
# Builds mssql-py-core + ddbc_bindings natively, then starts SQL Server
# via Colima (no TLS certs) and runs pytest with TrustServerCertificate=yes.

steps:
# ── 0. Generate per-job SQL_PASSWORD ─────────────────────────────────────────
- template: generate-sql-password-template.yml
  parameters:
    osType: MacOS

# ── 1. Python & Cargo setup ──────────────────────────────────────────────────
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.13'
    addToPath: true
  displayName: 'Use Python 3.13 on macOS'

- template: cargo-authenticate-template.yml
  parameters:
    osType: MacOS

- script: |
    brew update
    brew uninstall cmake --ignore-dependencies || echo "CMake not installed or already removed"
    brew install cmake
  displayName: 'Install CMake'

# ── 2. Clone mssql-python ────────────────────────────────────────────────────
- script: bash .pipeline/scripts/clone-mssql-python.sh
  displayName: Clone mssql-python

# ── 3. Build bindings (no Docker needed) ─────────────────────────────────────
- script: |
    set -euo pipefail

    MSSQL_PYTHON_DIR="$(Build.SourcesDirectory)/../mssql-python"

    python -m pip install --upgrade pip
    python -m pip install maturin pytest pytest-asyncio python-dotenv pybind11 wheel setuptools packaging patchelf
    python -m pip install -r "$MSSQL_PYTHON_DIR/requirements.txt"

    # Build ddbc_bindings (C++ pybind11 .so)
    echo "=== Building ddbc_bindings ==="
    cd "$MSSQL_PYTHON_DIR/mssql_python/pybind"
    chmod +x build.sh
    ./build.sh

    # Build and install the local Rust wheel before upstream package setup.
    echo "=== Building mssql-py-core ==="
    cd "$(Build.SourcesDirectory)/mssql-py-core"
    rm -rf dist/
    maturin build --release -o dist/

    WHEEL_FILE=$(ls dist/*.whl | head -1)
    echo "Installing mssql-py-core wheel: $WHEEL_FILE"
    python -m pip install "$WHEEL_FILE"

    echo "=== Verifying mssql_py_core is importable ==="
    python -c "import mssql_py_core; print('mssql_py_core OK')"

    # Package the ODBC dylibs prepared by build.sh from the same checkout.
    cd "$MSSQL_PYTHON_DIR"
    rm -rf odbc-dist/
    python setup_odbc.py bdist_wheel --dist-dir odbc-dist
  displayName: 'Build ddbc_bindings and mssql-py-core'
  env:
    CARGO_REGISTRIES_MSSQL_RS_PUBLIC_TOKEN: $(CARGO_REGISTRIES_MSSQL_RS_PUBLIC_TOKEN)
    CARGO_REGISTRIES_MSSQL_RS_TOKEN: $(CARGO_REGISTRIES_MSSQL_RS_TOKEN)

- script: |
    set -euo pipefail
    MSSQL_PYTHON_DIR="$(Build.SourcesDirectory)/../mssql-python"
    shopt -s nullglob
    ODBC_WHEELS=("$MSSQL_PYTHON_DIR"/odbc-dist/mssql_python_odbc-*.whl)
    if [ "${#ODBC_WHEELS[@]}" -ne 1 ]; then
      echo "##[error]Expected exactly one mssql-python-odbc wheel, found ${#ODBC_WHEELS[@]}"
      exit 1
    fi
    python -m pip install --no-deps "${ODBC_WHEELS[0]}"

    # PR/local runs use the pinned SHA; non-PR runs follow upstream main.
    # Preserve both job-owned native wheels instead of resolving release pins.
    python -m pip install --no-deps -e "$MSSQL_PYTHON_DIR"
  displayName: 'Install mssql-python packages'

- script: |
    set -euo pipefail
    echo "##vso[task.setvariable variable=mssqlPythonReady]false"
    python -m pytest .pipeline/scripts/verify-mssql-python.py -v -s \
      --junitxml="$(Build.SourcesDirectory)/mssql-python-macos-setup-results.xml"
  displayName: 'Verify installed mssql-python runtime'

- task: PublishTestResults@2
  condition: succeededOrFailed()
  displayName: Publish mssql-python macOS setup results
  inputs:
    testResultsFiles: '**/mssql-python-macos-setup-results.xml'
    testRunTitle: 'mssql-python macOS setup'
    failTaskOnFailedTests: false
    failTaskOnMissingResultsFile: true

# ── 4. Start Docker via Colima ───────────────────────────────────────────────
- template: macos-docker-steps.yml
  parameters:
    condition: and(succeeded(), eq(variables['mssqlPythonReady'], 'true'))

# ── 5. Start SQL Server (no TLS certs) ──────────────────────────────────────
- script: bash .pipeline/scripts/start-sql-server-macos.sh
  displayName: 'Start SQL Server (Docker, no TLS certs)'
  condition: and(succeeded(), eq(variables['mssqlPythonReady'], 'true'))
  timeoutInMinutes: 22
  env:
    SQL_PASSWORD: $(SQL_PASSWORD)

# ── 6. Run tests ─────────────────────────────────────────────────────────────
- script: |
    set -euo pipefail
    rc=0
    pytest $(Build.SourcesDirectory)/mssql-py-core/tests/mssql_python/ -v --tb=short --junitxml=$(Build.SourcesDirectory)/pytest-mssql-python-macos-results.xml || rc=$?
    if [ "$rc" -eq 1 ] && [ "${BUILD_REASON:-PullRequest}" != "PullRequest" ]; then
      echo "##vso[task.logissue type=warning]mssql-python macOS tests did not fully pass"
      echo "##vso[task.complete result=SucceededWithIssues;]"
      exit 0
    fi
    exit "$rc"
  displayName: 'Run mssql-python tests'
  condition: and(succeeded(), eq(variables['mssqlPythonReady'], 'true'))
  env:
    SQL_PASSWORD: $(SQL_PASSWORD)
    DB_CONNECTION_STRING: 'Server=tcp:127.0.0.1,1433;Database=master;Uid=sa;Pwd=$(SQL_PASSWORD);TrustServerCertificate=yes'
    DB_HOST: '127.0.0.1'
    DB_USERNAME: 'sa'
    SQL_SERVER: '127.0.0.1'
    SQL_DATABASE: 'master'
    TRUST_SERVER_CERTIFICATE: 'true'

- task: PublishTestResults@2
  condition: and(succeededOrFailed(), eq(variables['mssqlPythonReady'], 'true'))
  displayName: Publish mssql-python macOS test results
  inputs:
    testResultsFiles: '**/pytest-mssql-python-macos-results.xml'
    testRunTitle: 'mssql-python macOS tests'
    failTaskOnFailedTests: false
    failTaskOnMissingResultsFile: true

- script: |
    docker stop sqlserver || true
    docker rm sqlserver || true
  displayName: Cleanup SQL Server
  condition: and(always(), eq(variables['mssqlPythonReady'], 'true'))

- script: rm -rf $(Build.SourcesDirectory)/../mssql-python || true
  displayName: Cleanup
  condition: always()
