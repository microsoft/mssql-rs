parameters:
- name: osType
  type: string
  values:
  - Linux
  - MacOS
  - Windows
- name: architecture
  type: string
# Windows and macOS only. Linux validates the fixed release matrix in
# test-python-wheel-installs-linux.sh.
- name: pythonVersions
  type: object
  default:
  - '3.10'
  - '3.11'
  - '3.12'
  - '3.13'
  - '3.14'

steps:
- ${{ if eq(parameters.osType, 'Linux') }}:
  - script: |
      set -euo pipefail
      architecture='${{ parameters.architecture }}'
      if [ "$architecture" = 'x64' ]; then
        architecture='x86_64'
      elif [ "$architecture" = 'arm64' ]; then
        architecture='aarch64'
      fi
      bash "$(Build.SourcesDirectory)/scripts/test-python-wheel-installs-linux.sh" \
        "$(ob_outputDirectory)/wheels" "$architecture"
    displayName: 'Clean-install final Linux wheels'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

- ${{ if eq(parameters.osType, 'Windows') }}:
  - ${{ each pythonVersion in parameters.pythonVersions }}:
    - task: UsePythonVersion@0
      displayName: 'Use Python ${{ pythonVersion }} for install test'
      inputs:
        versionSpec: '${{ pythonVersion }}'
        architecture: '${{ parameters.architecture }}'
        addToPath: true
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        # The wheel is a single stable-ABI (cp310-abi3) build per platform,
        # forward-compatible with every interpreter in this loop - it is not
        # rebuilt or reselected per Python version.
        $platformTag = if ('${{ parameters.architecture }}' -eq 'arm64') { 'win_arm64' } else { 'win_amd64' }
        $wheels = @(Get-ChildItem "$(ob_outputDirectory)\wheels" -File -Filter "mssql_python_rs-*-cp310-abi3-$platformTag.whl")
        if ($wheels.Count -ne 1) {
          throw "Expected one cp310-abi3 $platformTag wheel, found $($wheels.Count)"
        }
        python "$(Build.SourcesDirectory)\scripts\test-python-wheel-install.py" --wheel $wheels[0].FullName
      displayName: 'Clean-install Python ${{ pythonVersion }} wheel (Windows ${{ parameters.architecture }})'
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

- ${{ if eq(parameters.osType, 'MacOS') }}:
  - task: UsePythonVersion@0
    displayName: 'Use Python ${{ parameters.pythonVersions[0] }} to verify macOS wheel'
    inputs:
      versionSpec: '${{ parameters.pythonVersions[0] }}'
      addToPath: true
  - script: |
      set -euo pipefail
      # The wheel is a single stable-ABI (cp310-abi3) build per platform, so
      # its architecture layout and driver exports are invariant across
      # every interpreter tested below - verify them once here instead of
      # once per interpreter in the install loop.
      shopt -s nullglob
      wheels=("$(ob_outputDirectory)/wheels"/mssql_python_rs-*-cp310-abi3-macosx_15_0_universal2.whl)
      if [ "${#wheels[@]}" -ne 1 ]; then
        echo "Expected one cp310-abi3 macOS universal2 wheel, found ${#wheels[@]}" >&2
        exit 1
      fi
      echo "##vso[task.setvariable variable=macosWheelPath]${wheels[0]}"
      extract_dir="$(mktemp -d)"
      trap 'rm -rf "$extract_dir"' EXIT
      python -m zipfile -e "${wheels[0]}" "$extract_dir"
      extensions=("$extract_dir"/mssql_py_core/mssql_py_core*.so)
      if [ "${#extensions[@]}" -ne 1 ]; then
        echo "Expected one mssql_py_core extension, found ${#extensions[@]}" >&2
        exit 1
      fi
      lipo "${extensions[0]}" -verify_arch x86_64 arm64
      lipo "$extract_dir/mssql_py_core/libs/macos/x86_64/lib/mssqlodbc.dylib" -verify_arch x86_64
      lipo "$extract_dir/mssql_py_core/libs/macos/arm64/lib/mssqlodbc.dylib" -verify_arch arm64
      python "$(Build.SourcesDirectory)/scripts/test-python-wheel-install.py" \
        --verify-driver-exports "$extract_dir/mssql_py_core/libs/macos/x86_64/lib/mssqlodbc.dylib"
      python "$(Build.SourcesDirectory)/scripts/test-python-wheel-install.py" \
        --verify-driver-exports "$extract_dir/mssql_py_core/libs/macos/arm64/lib/mssqlodbc.dylib"
      rm -rf "$extract_dir"
      trap - EXIT
    displayName: 'Verify macOS universal2 wheel architecture and driver exports'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  - ${{ each pythonVersion in parameters.pythonVersions }}:
    - task: UsePythonVersion@0
      displayName: 'Use Python ${{ pythonVersion }} for install test'
      inputs:
        versionSpec: '${{ pythonVersion }}'
        addToPath: true
    - script: |
        set -euo pipefail
        python "$(Build.SourcesDirectory)/scripts/test-python-wheel-install.py" --wheel "$(macosWheelPath)"
      displayName: 'Clean-install Python ${{ pythonVersion }} wheel (macOS universal2)'
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
