[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mssql-python-rs"
version = "0.0.0"
description = "Reserved name for the Rust-based native provider (TDS core + ODBC driver) consumed by mssql-python. Placeholder release; not yet functional."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Microsoft Corporation" }]
keywords = ["sqlserver", "azure-sql", "tds", "odbc", "mssql"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/microsoft/mssql-python"
Source = "https://github.com/microsoft/mssql-rs"

[tool.setuptools]
packages = ["mssql_python_rs"]
