# Fixed-baseline ODBC performance pipeline (dedicated perf lab)
#
# Builds the C++ benchmark harness once, builds the candidate and pinned-baseline
# mssql-odbc shared libraries separately, and runs the same harness through
# unixODBC against both drivers on one dedicated host.

trigger: none
pr: none

resources:
  repositories:
    - repository: PerfTemplates
      type: git
      name: InternalDriverTools/PerfTest
      ref: refs/heads/main

extends:
  template: v1/Perf.Test.Job.yml@PerfTemplates
  parameters:
    platform: linux
    testRootDir: $(Build.SourcesDirectory)/mssql-rs
    testScript: mssql-odbc-bench/perf-lab/run-benchmarks.sh
    testScriptArgs: none
    testResultsSubDir: results
    testTimeoutMinutes: 180
    steps:
      - bash: |
          set -euo pipefail
          report="$(Build.ArtifactStagingDirectory)/results/summary.md"
          echo "=== ODBC benchmark comparison ==="
          if [ -f "$report" ]; then
            cat "$report"
          else
            echo "summary.md not found"
          fi
        displayName: 'Show ODBC benchmark comparison'
