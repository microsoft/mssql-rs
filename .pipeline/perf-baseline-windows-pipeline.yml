# Fixed-baseline performance pipeline — WINDOWS (dedicated perf lab)
#
# Windows counterpart to perf-baseline-linux-pipeline.yml. Manual ODBC runs set
# benchmarkSuite to odbc; scheduled runs retain the tds default. Windows and
# Linux numbers are not comparable and remain independently scheduled.
#
# The selected testScript builds the candidate and baseline on the VM from the
# working tree and a local worktree of its reviewed baseline commit.
#
# The weekly cron is staggered two hours after the Linux pipeline's so the two
# scheduled runs do not contend for the lab's limited VM slots. ADO scheduled
# triggers always use default parameter values.

parameters:
  - name: benchmarkSuite
    displayName: Benchmark suite
    type: string
    default: tds
    values:
      - tds
      - odbc

trigger: none
pr: none

schedules:
  - cron: '0 10 * * 1'
    displayName: Weekly baseline comparison (Windows)
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: PerfTemplates
      type: git
      name: InternalDriverTools/PerfTest
      ref: refs/heads/main

extends:
  template: v1/Perf.Test.Job.yml@PerfTemplates
  parameters:
    platform: windows
    # Ship the whole repo (including .git) so the testScript can create a local
    # worktree of the baseline commit with no VM-side ADO authentication. The
    # baseline commit must be present in the shipped history (full checkout).
    testRootDir: $(Build.SourcesDirectory)/mssql-rs
    ${{ if eq(parameters.benchmarkSuite, 'tds') }}:
      testScript: mssql-tds-bench/perf-lab/run-benchmarks.ps1
      testTimeoutMinutes: 120
    ${{ if eq(parameters.benchmarkSuite, 'odbc') }}:
      testScript: mssql-odbc-bench/perf-lab/run-benchmarks.ps1
      testTimeoutMinutes: 180
    testScriptArgs: none
    testResultsSubDir: results
    steps:
      - bash: |
          set -euo pipefail
          suite="${{ parameters.benchmarkSuite }}"
          if [ "$suite" = "odbc" ]; then
            report="$(Build.ArtifactStagingDirectory)/results/summary.md"
          else
            report="$(Build.ArtifactStagingDirectory)/results/comparison.txt"
          fi
          echo "=== $suite benchmark comparison (base -> candidate) ==="
          if [ -f "$report" ]; then
            cat "$report"
          else
            echo "$(basename "$report") not found"
          fi
        displayName: 'Show benchmark comparison'
