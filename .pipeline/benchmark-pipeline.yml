# Performance benchmark pipeline
#
# Compares Criterion benchmark results between the PR branch and
# the target branch to detect performance regressions.
# Runs on Linux x64 only.
#
# Checkout credentials are not retained. Resolve and fetch the public baseline
# before repository setup/build code runs, then compare pinned commits locally.
# This does not sandbox PR code: agent isolation and service-token permissions
# remain deployment responsibilities, not guarantees of this pipeline.

trigger: none

pr:
  branches:
    include:
      - main

parameters:
  - name: baselineBranch
    displayName: 'Baseline branch (for manual runs; PR builds auto-detect target)'
    # Accept a branch, tag, full ref, or commit SHA using ASCII letters, digits,
    # underscores, dots, slashes, and hyphens; no refspecs or revision expressions.
    type: string
    default: main
  - name: linuxImage
    displayName: 'Agent image for x64 Linux jobs'
    type: string
    default: RUST-AZL3

stages:
  - stage: Benchmark
    displayName: Performance Benchmark
    jobs:
      - job: Benchmark
        displayName: 'Criterion Benchmark'
        timeoutInMinutes: 30
        pool:
          name: RUST-X64-WUS3
          demands:
            - imageOverride -equals ${{ parameters.linuxImage }}
        variables:
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'

        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: false

          - script: |
              set -euo pipefail
              if [ "$BUILD_REASON" = "PullRequest" ]; then
                BASELINE="${PR_TARGET_REF#refs/heads/}"
              else
                BASELINE="$MANUAL_BASELINE_REF"
              fi
              # Limit logging to inert single-line data and reject Git options/refspecs.
              if [[ ! "$BASELINE" =~ ^[A-Za-z0-9_][A-Za-z0-9._/-]*$ ]] ||
                 ! git check-ref-format --allow-onelevel "$BASELINE"; then
                echo "##vso[task.logissue type=error]Invalid benchmark baseline ref"
                exit 1
              fi

              PR_SHA=$(git rev-parse --verify 'HEAD^{commit}')
              # Use the public URL, not a credential-bearing checkout remote.
              GIT_TERMINAL_PROMPT=0 git fetch --no-tags -- https://github.com/microsoft/mssql-rs.git "$BASELINE"
              BASELINE_SHA=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
              if [[ ! "$PR_SHA" =~ ^[0-9a-f]{40}$ || ! "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "##vso[task.logissue type=error]Invalid benchmark commit SHA"
                exit 1
              fi
              echo "PR commit: $PR_SHA"
              echo "Baseline branch: $BASELINE ($BASELINE_SHA)"
              echo "##vso[task.setvariable variable=PR_SHA;isReadOnly=true]$PR_SHA"
              echo "##vso[task.setvariable variable=BASELINE_BRANCH;isReadOnly=true]$BASELINE"
              echo "##vso[task.setvariable variable=BASELINE_SHA;isReadOnly=true]$BASELINE_SHA"
            displayName: Resolve and fetch benchmark refs
            env:
              BUILD_REASON: $(Build.Reason)
              PR_TARGET_REF: $(System.PullRequest.TargetBranch)
              MANUAL_BASELINE_REF: ${{ parameters.baselineBranch }}

          - template: templates/install-dependencies.yml
            parameters:
              osType: Linux
              enableJsDeps: false

          - template: templates/cargo-authenticate-template.yml
            parameters:
              osType: Linux

          - template: templates/sql-setup-template.yml
            parameters:
              buildTarget: Linux

          - script: |
              set -euo pipefail
              CONTAINER_ID=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2025-latest)
              if [ -z "$CONTAINER_ID" ]; then
                echo "##vso[task.logissue type=error]No SQL Server container found"
                exit 1
              fi
              if [ "$(echo "$CONTAINER_ID" | wc -l)" -ne 1 ]; then
                echo "##vso[task.logissue type=error]Multiple SQL Server containers found"
                exit 1
              fi
              echo "SQL Server container: $CONTAINER_ID"
              for i in $(seq 1 30); do
                if docker exec "$CONTAINER_ID" /opt/mssql-tools18/bin/sqlcmd \
                  -S localhost -U sa -P "$SQL_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
                  echo "SQL Server ready after $((i * 2))s"
                  exit 0
                fi
                echo "Waiting for SQL Server... ($i/30)"
                sleep 2
              done
              echo "##vso[task.logissue type=error]SQL Server did not become ready in time"
              exit 1
            displayName: Wait for SQL Server
            env:
              SQL_PASSWORD: $(SQL_PASSWORD)

          - script: cargo install critcmp --version 0.1.8 --locked
            displayName: Install critcmp

          - script: cargo fetch
            displayName: Fetch crates

          - script: |
              set -euo pipefail
              echo "=== Checking out baseline: $BASELINE_SHA ==="
              git checkout --detach "$BASELINE_SHA"

              echo "=== Running baseline benchmarks ==="
              cargo bench --package mssql-tds --bench perf -- --save-baseline base
            displayName: 'Baseline benchmarks ($(BASELINE_BRANCH))'
            env:
              BASELINE_SHA: $(BASELINE_SHA)
              SQL_PASSWORD: $(SQL_PASSWORD)
              DB_HOST: localhost
              DB_PORT: '1433'
              DB_USERNAME: sa
              TRUST_SERVER_CERTIFICATE: 'true'
              CERT_HOST_NAME: sql1

          - script: |
              set -euo pipefail
              echo "=== Checking out PR commit: $PR_SHA ==="
              git checkout --detach "$PR_SHA"

              echo "=== Running PR benchmarks ==="
              cargo bench --package mssql-tds --bench perf -- --save-baseline pr
            displayName: 'PR benchmarks'
            env:
              PR_SHA: $(PR_SHA)
              SQL_PASSWORD: $(SQL_PASSWORD)
              DB_HOST: localhost
              DB_PORT: '1433'
              DB_USERNAME: sa
              TRUST_SERVER_CERTIFICATE: 'true'
              CERT_HOST_NAME: sql1

          - script: |
              set -euo pipefail
              echo ""
              echo "============================================"
              echo "  Benchmark Comparison: base → pr"
              echo "============================================"
              echo ""
              mkdir -p "$(Build.ArtifactStagingDirectory)/benchmarks"
              critcmp base pr | tee "$(Build.ArtifactStagingDirectory)/benchmarks/comparison.txt"
            displayName: Compare results

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/benchmarks'
              artifactName: benchmark-results
            displayName: Publish benchmark results
            condition: always()
