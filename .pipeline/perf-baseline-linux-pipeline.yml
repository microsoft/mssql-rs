# Fixed-baseline performance pipeline (dedicated perf lab)
#
# Runs either the mssql-tds source benchmark (the default) or the complete
# mssql-odbc driver benchmark against a fixed baseline. Manual ODBC runs set
# benchmarkSuite to odbc; scheduled runs retain the tds default.
#
# This pipeline consumes the shared PerfTest lab template, which runs the
# benchmarks on a dedicated host VM (not on shared/noisy build agents):
#   select region -> generate SSH key -> deploy VM -> copy repo -> run the
#   testScript on the VM -> collect results -> tear down.
#
# The selected testScript builds the candidate and baseline on the VM from the
# working tree and a local worktree of its reviewed baseline commit.
#
# Complements benchmark-pipeline.yml (PR vs target branch). Trigger manually or
# on the weekly schedule below.
#
# This definition is Linux-only. Its Windows counterpart is
# perf-baseline-windows-pipeline.yml; platform results remain independent.

parameters:
  - name: benchmarkSuite
    displayName: Benchmark suite
    type: string
    default: tds
    values:
      - tds
      - odbc

trigger: none
pr: none

schedules:
  - cron: '0 8 * * 1'
    displayName: Weekly baseline comparison (Linux)
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: PerfTemplates
      type: git
      name: InternalDriverTools/PerfTest
      ref: refs/heads/main

extends:
  template: v1/Perf.Test.Job.yml@PerfTemplates
  parameters:
    platform: linux
    # Ship the whole repo (including .git) so the testScript can create a local
    # worktree of the baseline commit with no VM-side ADO authentication. The
    # baseline commit must be present in the shipped history (full checkout).
    testRootDir: $(Build.SourcesDirectory)/mssql-rs
    ${{ if eq(parameters.benchmarkSuite, 'tds') }}:
      testScript: mssql-tds-bench/perf-lab/run-benchmarks.sh
      testTimeoutMinutes: 120
    ${{ if eq(parameters.benchmarkSuite, 'odbc') }}:
      testScript: mssql-odbc-bench/perf-lab/run-benchmarks.sh
      testTimeoutMinutes: 180
    testScriptArgs: none
    testResultsSubDir: results
    steps:
      - bash: |
          set -euo pipefail
          suite="${{ parameters.benchmarkSuite }}"
          if [ "$suite" = "odbc" ]; then
            report="$(Build.ArtifactStagingDirectory)/results/summary.md"
          else
            report="$(Build.ArtifactStagingDirectory)/results/comparison.txt"
          fi
          echo "=== $suite benchmark comparison (base -> candidate) ==="
          if [ -f "$report" ]; then
            cat "$report"
          else
            echo "$(basename "$report") not found"
          fi
        displayName: 'Show benchmark comparison'
