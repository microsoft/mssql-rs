# THROWAWAY BRANCH: the fixed-baseline perf pipeline is repointed at the
# ConnectorX TPC-H A/B harness (mssql-tds-bench/connectorx-tpch). Baseline is
# connectorx==0.4.6 (Tiberius), candidate is connectorx==0.4.7a1 (mssql-tds).
# Queue this definition on this branch; do not merge.

trigger: none
pr: none

resources:
  repositories:
    - repository: PerfTemplates
      type: git
      name: InternalDriverTools/PerfTest
      ref: refs/heads/main

extends:
  template: v1/Perf.Test.Job.yml@PerfTemplates
  parameters:
    platform: linux
    # Ship only the harness; results land in <testRootDir>/results.
    testRootDir: $(Build.SourcesDirectory)/mssql-rs/mssql-tds-bench/connectorx-tpch
    testScript: run-benchmarks.sh
    # KEY=VALUE overrides, e.g. 'SF=10 ROUNDS=5 PARTITIONS=1,4 ENCRYPT_MODES=false,true INCLUDE_CONTROL=1'.
    testScriptArgs: none
    testResultsSubDir: results
    testTimeoutMinutes: 240
    steps:
      - bash: |
          set -euo pipefail
          summary="$(Build.ArtifactStagingDirectory)/results/summary.md"
          if [ -f "$summary" ]; then cat "$summary"; else echo "summary.md not found"; fi
        displayName: 'Show ConnectorX A/B summary'
        condition: always()