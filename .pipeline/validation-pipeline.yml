# CI trigger only on development. Main-branch builds are produced by the
# Official pipeline (OneBranch/OfficialPythonWheelsBuild.yml) on merge.
trigger:
- development

parameters:
- name: githubBranch
  displayName: GitHub branch
  type: string
  default: '$(Build.SourceBranch)'

jobs:
- job: Build
  timeoutInMinutes: 15
  pool:
    type: linux
    isCustom: true
    name: Azure Pipelines
    vmImage: 'macOS-latest'
  steps:
  - pwsh: |
      Write-Host "Reason: $(Build.Reason)"
      Write-Host "Branch: ${{ parameters.githubBranch }}"
      Write-Host "Operating System: $(Agent.OS)"
      Write-Host "Architecture: $(Agent.OSArchitecture)"
    displayName: Debug information