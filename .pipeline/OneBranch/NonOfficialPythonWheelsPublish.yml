#################################################################################
#                        OneBranch Pipelines - NonOfficial                      #
# Builds Python wheels from PyO3 bindings across 9 tags, stamps a PEP 440      #
# dev/nightly version into each wheel, and twine-uploads them to the           #
# mssql-rs_Public Azure Artifacts PyPI feed (pip-installable dev + nightly).   #
# Also builds Rust crates and retains them as build artifacts.                 #
# Documentation:  https://aka.ms/obpipelines                                    #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Retail Tasks:   https://aka.ms/obpipelines/tasks                              #
# Support:        https://aka.ms/onebranchsup                                   #
#################################################################################

# Source repo is GitHub microsoft/mssql-rs. CI runs on merge to main and on
# PRs into main. Nightly schedule (below) also runs against main.
trigger:
- main

pr:
- main

# Nightly builds
schedules:
- cron: '0 2 * * *'
  displayName: Nightly build
  branches:
    include:
    - main
  always: true

parameters:
- name: publishToFeed
  displayName: 'Publish wheels to the Azure Artifacts PyPI feed'
  type: boolean
  default: true

- name: buildOdbcNative
  displayName: 'Also build mssql-odbc native driver'
  type: boolean
  default: true

variables:
  CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)]  # For onebranch.pipeline.version task
  LinuxContainerImage: 'mcr.microsoft.com/onebranch/azurelinux/build:3.0'
  WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'
  DEBIAN_FRONTEND: noninteractive
  # IMPORTANT: This feed must be an Azure Artifacts NuGet feed in your ADO org with
  # azure-feed://mscodehub/Rust/Rust@Release as an upstream source.
  # The pipeline build service account needs Collaborator permissions on this feed.
  # See https://aka.ms/rustinado for setup details.
  toolchainFeed: 'https://sqlclientdrivers.pkgs.visualstudio.com/mssql-rs/_packaging/mssql-rs/nuget/v3/index.json'
  # Project-scoped Azure Artifacts feed (<project>/<feed>) that also serves the
  # PyPI protocol. mssql-python-rs wheels are twine-uploaded here for pip install.
  pythonArtifactFeed: 'public/mssql-rs_Public'
  # Twine repository name matching the .pypirc entry TwineAuthenticate@1 writes.
  pythonFeedName: 'mssql-rs_Public'
  # Anonymous-read PEP 503 index for the same feed; the upload step reads it to
  # skip wheels an earlier, partially failed attempt already published.
  pythonSimpleIndex: 'https://pkgs.dev.azure.com/sqlclientdrivers/public/_packaging/mssql-rs_Public/pypi/simple/'

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion: 1ESWindows2022
    globalSdl:
      binskim:
        # Rust build scripts will not be built with spectre-mitigations enabled
        scanOutputDirectoryOnly: true
      clippy:
        enabled: true
    # Python wheels publish to this feed's PyPI index via twine; the
    # mssql-sqlcmd NuGet package still publishes through nugetPublishing.
    nugetPublishing:
      feeds:
      - name: public/mssql-rs_Public
        continueOnConflict: true
    stages:
    - template: /.pipeline/OneBranch/stages.yml@self
      parameters:
        buildAllTargets: true
        buildPythonWheels: true
        buildOdbcNative: ${{ parameters.buildOdbcNative }}
        buildRustCrates: true
        isOfficial: false
        publishToFeed: ${{ parameters.publishToFeed }}
        buildMssqlSqlcmd: true
