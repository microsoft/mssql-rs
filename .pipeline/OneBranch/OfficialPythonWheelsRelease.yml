#################################################################################
#                        OneBranch Pipelines - Official Release                 #
# Downloads artifacts from the Official Build pipeline, publishes the wheel    #
# NuGet package to Azure Artifacts, and can publish Rust crates to crates.io.   #
# It can also tag the source commit and create a release branch.                #
#                                                                               #
# This pipeline does NOT build anything — it consumes artifacts produced by    #
# OfficialBuild.yml.                                                            #
#                                                                               #
# The source commit is obtained from the build pipeline via                     #
#   $(resources.pipeline.officialBuild.sourceCommit)                            #
# This is the exact commit that was built and is used for git tagging and       #
# release branch creation.                                                      #
#                                                                               #
# Documentation:  https://aka.ms/obpipelines                                    #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Support:        https://aka.ms/onebranchsup                                   #
#################################################################################

name: $(Year:YY)$(DayOfYear)$(Rev:.r)-Release

# Manual trigger only — releases should be deliberate
trigger: none
pr: none

parameters:
  - name: publishNuGet
    displayName: 'Publish NuGet package to Azure Artifacts'
    type: boolean
    default: false  # Safety: default to false to prevent accidental releases

  - name: publishMssqlTds
    displayName: 'Publish mssql-tds to crates.io'
    type: boolean
    default: false  # Safety: default to false to prevent accidental releases

  - name: publishMssqlMockTds
    displayName: 'Publish mssql-mock-tds to crates.io'
    type: boolean
    default: false  # Safety: default to false to prevent accidental releases

  - name: validateCratesOnly
    displayName: 'Validate selected Rust crates without publishing'
    type: boolean
    default: false

  - name: tagRelease
    displayName: 'Create mssql-py-core git tag and release branch'
    type: boolean
    default: false  # Safety: default to false

variables:
  CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)]
  LinuxContainerImage: 'mcr.microsoft.com/onebranch/azurelinux/build:3.0'
  WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'
  DEBIAN_FRONTEND: noninteractive

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

  # Reference to the Official Build pipeline.
  # When running this release pipeline, the operator selects which build run
  # to release from. ADO populates resources.pipeline.officialBuild.runID and
  # resources.pipeline.officialBuild.sourceCommit automatically.
  pipelines:
    - pipeline: officialBuild
      source: 'Official Python Wheels Build'  # ADO pipeline definition name (ID 2234)
      trigger: none  # Manual only — no automatic release on build completion

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion: 1ESWindows2022
    globalSdl:
      binskim:
        enabled: true
        scanOutputDirectoryOnly: true
      credscan:
        enabled: true
      policheck:
        enabled: true
    nugetPublishing:
      feeds:
      - name: public/mssql-rs_Public
        continueOnConflict: false

    stages:
    ###########################################################################
    # Python is independent of Rust. Only selected publication contacts NuGet.
    ###########################################################################
    - stage: Release
      displayName: 'Validate Wheels and Optionally Publish NuGet'
      dependsOn: []
      jobs:
      - job: ValidateWheels
        displayName: 'Validate Official Wheels'
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
          ob_nugetPublishing_enabled: false
          ob_git_fetchDepth: 0
          ob_git_persistCredentials: true
        steps:
        - template: ../templates/validate-release-wheels.yml

      - ${{ if eq(parameters.publishNuGet, true) }}:
        - job: NuGetPreflight
          displayName: 'Check NuGet release version'
          dependsOn: ValidateWheels
          pool:
            type: windows
            isCustom: true
            name: Azure Pipelines
            vmImage: windows-2022
          variables:
            releaseVersion: $[ dependencies.ValidateWheels.outputs['wheelMetadata.releaseVersion'] ]
          steps:
          # Custom jobs do not inject a checkout; governed jobs below do.
          - checkout: self
          - pwsh: >
              & "$(Build.SourcesDirectory)/.pipeline/scripts/test-nuget-release-version.ps1"
              -Version "$(releaseVersion)"
            displayName: 'Preflight wheel NuGet version'

        - job: PublishNuGet
          displayName: 'Publish Official Wheel NuGet'
          dependsOn: NuGetPreflight
          pool:
            type: windows
          variables:
            ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
            ob_nugetPublishing_enabled: true
            ob_git_fetchDepth: 0
            ob_git_persistCredentials: true
          steps:
          - template: ../templates/validate-release-wheels.yml
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $packageVersion = "$(wheelMetadata.releaseVersion)"
              $distributionName = "$(wheelMetadata.releaseDistributionName)"
              $shortSha = "$(wheelMetadata.sourceCommit)".Substring(0, 8)

              $nuspecContent = @"
              <?xml version="1.0"?>
              <package>
                <metadata>
                  <id>mssql-python-rs-wheels</id>
                  <version>$packageVersion</version>
                  <description>Python wheels containing the $distributionName TDS core and ODBC driver. Commit: $shortSha. Build: $(resources.pipeline.officialBuild.runID)</description>
                  <authors>SqlClientDrivers</authors>
                </metadata>
                <files>
                  <file src="wheels\**\*.whl" target="wheels" />
                </files>
              </package>
              "@

              $nuspecPath = "$(Build.StagingDirectory)/mssql-python-rs-wheels.nuspec"
              $nuspecContent | Out-File -FilePath $nuspecPath -Encoding utf8
              Write-Host "Created nuspec: $nuspecPath"
            displayName: 'Prepare release NuGet package'

          - task: NuGetCommand@2
            displayName: 'Create NuGet package'
            inputs:
              command: pack
              packagesToPack: '$(Build.StagingDirectory)/mssql-python-rs-wheels.nuspec'
              packDestination: '$(ob_outputDirectory)/packages'
              basePath: '$(Build.StagingDirectory)'

          - pwsh: |
              Write-Host "=== Release NuGet package ==="
              Get-ChildItem "$(ob_outputDirectory)/packages" -Filter *.nupkg | ForEach-Object {
                Write-Host "  $($_.Name)  ($([math]::Round($_.Length/1MB, 2)) MB)"
              }
              Write-Host "NuGet WILL be published to feed (publishNuGet=true)"
            displayName: 'Verify NuGet package'

    ###########################################################################
    # Rust: offline integrity -> registry preflight -> ESRP -> availability.
    # Read-only custom jobs run on Azure Pipelines, never in isolated containers.
    ###########################################################################
    - ${{ if or(eq(parameters.publishMssqlTds, true), eq(parameters.publishMssqlMockTds, true), eq(parameters.validateCratesOnly, true)) }}:
      - stage: ReleaseCrates
        displayName: 'Release Rust Crates'
        dependsOn: []
        jobs:
        - job: ValidateCrates
          displayName: 'Validate Rust crate artifacts'
          pool:
            type: windows
          variables:
            ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
          steps:
          - template: ../templates/validate-release-crates.yml

        - ${{ if or(eq(parameters.publishMssqlTds, true), eq(parameters.publishMssqlMockTds, true)) }}:
          - job: RegistryPreflight
            displayName: 'Check selected crates.io versions'
            dependsOn: ValidateCrates
            pool:
              type: windows
              isCustom: true
              name: Azure Pipelines
              vmImage: windows-2022
            steps:
            - checkout: self
            - template: ../templates/validate-release-crates.yml

            - ${{ if eq(parameters.publishMssqlTds, true) }}:
              - pwsh: >
                  & "$(Build.SourcesDirectory)/.pipeline/scripts/test-cratesio-package.ps1"
                  -CrateName 'mssql-tds'
                  -Version '$(mssqlTdsCrateVersion)'
                  -ExpectedState Absent
                  -MaxAttempts 1
                displayName: 'Preflight mssql-tds version'

            - ${{ if eq(parameters.publishMssqlMockTds, true) }}:
              - pwsh: >
                  & "$(Build.SourcesDirectory)/.pipeline/scripts/test-cratesio-package.ps1"
                  -CrateName 'mssql-mock-tds'
                  -Version '$(mssqlMockTdsCrateVersion)'
                  -ExpectedState Absent
                  -MaxAttempts 1
                displayName: 'Preflight mssql-mock-tds version'

            - ${{ if and(eq(parameters.publishMssqlMockTds, true), ne(parameters.publishMssqlTds, true)) }}:
              - pwsh: >
                  & "$(Build.SourcesDirectory)/.pipeline/scripts/test-cratesio-package.ps1"
                  -CrateName 'mssql-tds'
                  -Version '$(mssqlTdsCrateVersion)'
                  -ExpectedState Available
                  -MaxAttempts 1
                displayName: 'Verify mssql-tds dependency is published'

        - ${{ if and(eq(parameters.publishMssqlTds, true), ne(parameters.validateCratesOnly, true)) }}:
          - job: PublishCore
            displayName: 'Publish mssql-tds'
            dependsOn: RegistryPreflight
            templateContext:
              type: releaseJob
              isProduction: true
            pool:
              type: windows
            variables:
            - group: 'ESRP Federated Creds (AME)'
            - name: ob_outputDirectory
              value: '$(Build.ArtifactStagingDirectory)'
            steps:
            - template: ../templates/validate-release-crates.yml
            - task: EsrpRelease@12
              displayName: 'Publish mssql-tds to crates.io'
              inputs:
                connectedservicename: 'ESRP Managed Identity federated auth - AME tenant-mssql-rs'
                usemanagedidentity: true
                keyvaultname: '$(AuthAKVName)'
                signcertname: '$(AuthSignCertName)'
                clientid: '$(EsrpClientId)'
                intent: 'PackageDistribution'
                contenttype: 'Rust'
                contentsource: 'Folder'
                folderlocation: '$(Pipeline.Workspace)\officialBuild\drop_Build_RustCrates\mssql-tds'
                waitforreleasecompletion: true
                owners: '$(owner)'
                approvers: '$(approver)'
                serviceendpointurl: 'https://api.esrp.microsoft.com'
                mainpublisher: 'ESRPRELPACMAN'
                domaintenantid: '975f013f-7f24-47e8-a7d3-abc4752bf346'

          - job: CoreAvailable
            displayName: 'Verify published mssql-tds is available'
            dependsOn: PublishCore
            pool:
              type: windows
              isCustom: true
              name: Azure Pipelines
              vmImage: windows-2022
            steps:
            - checkout: self
            - template: ../templates/validate-release-crates.yml
            - pwsh: >
                & "$(Build.SourcesDirectory)/.pipeline/scripts/test-cratesio-package.ps1"
                -CrateName 'mssql-tds'
                -Version '$(mssqlTdsCrateVersion)'
                -ExpectedState Available
              displayName: 'Wait for mssql-tds on crates.io'

        - ${{ if and(eq(parameters.publishMssqlMockTds, true), ne(parameters.validateCratesOnly, true)) }}:
          - job: PublishMock
            displayName: 'Publish mssql-mock-tds'
            ${{ if eq(parameters.publishMssqlTds, true) }}:
              dependsOn: CoreAvailable
            ${{ else }}:
              dependsOn: RegistryPreflight
            templateContext:
              type: releaseJob
              isProduction: true
            pool:
              type: windows
            variables:
            - group: 'ESRP Federated Creds (AME)'
            - name: ob_outputDirectory
              value: '$(Build.ArtifactStagingDirectory)'
            steps:
            - template: ../templates/validate-release-crates.yml
            - task: EsrpRelease@12
              displayName: 'Publish mssql-mock-tds to crates.io'
              inputs:
                connectedservicename: 'ESRP Managed Identity federated auth - AME tenant-mssql-rs'
                usemanagedidentity: true
                keyvaultname: '$(AuthAKVName)'
                signcertname: '$(AuthSignCertName)'
                clientid: '$(EsrpClientId)'
                intent: 'PackageDistribution'
                contenttype: 'Rust'
                contentsource: 'Folder'
                folderlocation: '$(Pipeline.Workspace)\officialBuild\drop_Build_RustCrates\mssql-mock-tds'
                waitforreleasecompletion: true
                owners: '$(owner)'
                approvers: '$(approver)'
                serviceendpointurl: 'https://api.esrp.microsoft.com'
                mainpublisher: 'ESRPRELPACMAN'
                domaintenantid: '975f013f-7f24-47e8-a7d3-abc4752bf346'

          - job: MockAvailable
            displayName: 'Verify published mssql-mock-tds is available'
            dependsOn: PublishMock
            pool:
              type: windows
              isCustom: true
              name: Azure Pipelines
              vmImage: windows-2022
            steps:
            - checkout: self
            - template: ../templates/validate-release-crates.yml
            - pwsh: >
                & "$(Build.SourcesDirectory)/.pipeline/scripts/test-cratesio-package.ps1"
                -CrateName 'mssql-mock-tds'
                -Version '$(mssqlMockTdsCrateVersion)'
                -ExpectedState Available
              displayName: 'Verify mssql-mock-tds on crates.io'

    ###########################################################################
    # Stage 3: Tag the mssql-py-core release source
    ###########################################################################
    - ${{ if eq(parameters.tagRelease, true) }}:
      - stage: Tag
        displayName: 'Tag mssql-py-core Release'
        dependsOn: Release
        jobs:
        - job: TagAndBranch
          displayName: 'Git tag + release branch'
          pool:
            type: windows
          variables:
            ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
            ob_git_fetchDepth: 0
            ob_git_persistCredentials: true
          steps:
          - pwsh: |
              $ErrorActionPreference = 'Stop'

              $metadata = & "$(Build.SourcesDirectory)/.pipeline/scripts/get-python-release-metadata.ps1" `
                -RepositoryDirectory "$(Build.SourcesDirectory)" `
                -CommitSha "$(resources.pipeline.officialBuild.sourceCommit)" `
                -SourceBranch "$(resources.pipeline.officialBuild.sourceBranch)"
              $commitSha = $metadata.SourceCommit
              $version = $metadata.Version

              $tagName = "v$version"
              $branchName = "release/$version"

              Write-Host "Version:    $version"
              Write-Host "Commit:     $commitSha"
              Write-Host "Tag:        $tagName"
              Write-Host "Branch:     $branchName"

              # Create annotated tag on the build's source commit
              git -C "$(Build.SourcesDirectory)" tag -a $tagName $commitSha -m "Release $version"
              if ($LASTEXITCODE -ne 0) { Write-Error "Failed to create tag"; exit 1 }

              # Create release branch from the tagged commit
              git -C "$(Build.SourcesDirectory)" branch $branchName $commitSha
              if ($LASTEXITCODE -ne 0) { Write-Error "Failed to create branch"; exit 1 }

              # Push tag and branch
              git -C "$(Build.SourcesDirectory)" push origin $tagName
              if ($LASTEXITCODE -ne 0) { Write-Error "Failed to push tag"; exit 1 }

              git -C "$(Build.SourcesDirectory)" push origin $branchName
              if ($LASTEXITCODE -ne 0) { Write-Error "Failed to push branch"; exit 1 }

              Write-Host "====================================="
              Write-Host "Release tagged and branched:"
              Write-Host "  Tag:    $tagName -> $commitSha"
              Write-Host "  Branch: $branchName"
              Write-Host "====================================="
            displayName: 'Create git tag and release branch'
            workingDirectory: '$(Build.SourcesDirectory)'
