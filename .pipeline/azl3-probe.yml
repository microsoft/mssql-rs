# azl3-probe.yml
#
# TEMPORARY. Delete once the Azure Linux 3 evaluation concludes.
#
# Three Ubuntu findings (USN-7977-1 git-lfs, USN-7588-1 gss-ntlmssp, USN-8344-1
# python3-pip) are fixed on jammy only under Ubuntu Pro, so the agent images
# cannot be patched clean. RUST-AZL3 / RUST-AZL3-ARM64 are candidate
# replacements. Both are present in every pool at poolBufferPercentage 0, so the
# ONLY way to land on one is the imageOverride demand below.
#
# This pipeline answers, with evidence rather than inference:
#   1. what the AZL3 starter image already provides (az in particular)
#   2. whether the CVE packages are present and at patched versions
#   3. which host-level Debian assumptions in our own scripts actually break
#
# Manual trigger only. It must never run on PR or CI.
trigger: none
pr: none

parameters:
  - name: runHostBringUp
    displayName: Also run the real install-dependencies template (expected to fail on AZL3)
    type: boolean
    default: true

  # RUST-AZL3-ARM64 does not exist yet: its base gallery image requires
  # TrustedLaunch and no v5 ARM SKU supports that, including the D8pds_v5 the ARM
  # pools run. Until that is resolved the image is in no pool, so this demand
  # cannot be satisfied and the job would just sit unscheduled.
  - name: runArm64
    displayName: Include the ARM64 probe (only once RUST-AZL3-ARM64 exists in the pools)
    type: boolean
    default: false

variables:
  ${{ if eq(variables['System.TeamProject'], 'public') }}:
    x64Pool: RUST-PUBLIC-X64-WUS3
    armPool: RUST-PUBLIC-ARM64-WUS3
    utilPool: RUST-PUBLIC-UTIL-WUS3
  ${{ else }}:
    x64Pool: RUST-X64-WUS3
    armPool: RUST-ARM64-WUS3
    utilPool: RUST-UTIL-WUS3

stages:
- stage: Probe
  displayName: Azure Linux 3 probe
  jobs:

  - job: Inventory_AZL3_Util
    displayName: 'Inventory: AZL3 x64 on the utility pool'
    pool:
      name: $(utilPool)
      demands:
        - imageOverride -equals RUST-AZL3
    steps:
    - checkout: none
    - template: templates/azl3-inventory-steps.yml
      parameters:
        label: 'AZL3 x64 (utility pool, D2ads_v6)'

  - job: Inventory_AZL3_X64
    displayName: 'Inventory: AZL3 x64 on the build pool'
    pool:
      name: $(x64Pool)
      demands:
        - imageOverride -equals RUST-AZL3
    steps:
    - checkout: none
    - template: templates/azl3-inventory-steps.yml
      parameters:
        label: 'AZL3 x64 (build pool, D8ads_v6)'

  - ${{ if eq(parameters.runArm64, true) }}:
    - job: Inventory_AZL3_ARM64
      displayName: 'Inventory: AZL3 ARM64 on the build pool'
      pool:
        name: $(armPool)
        demands:
          - imageOverride -equals RUST-AZL3-ARM64
      steps:
      - checkout: none
      - template: templates/azl3-inventory-steps.yml
        parameters:
          label: 'AZL3 ARM64 (build pool, D8pds_v5)'

  # Baseline on the image we are trying to replace, so the comparison is like for
  # like rather than against expectations.
  - job: Inventory_Ubuntu_Baseline
    displayName: 'Inventory: Ubuntu baseline (for comparison)'
    pool:
      name: $(x64Pool)
      demands:
        - imageOverride -equals RUST-UBUSLIM
    steps:
    - checkout: none
    - template: templates/azl3-inventory-steps.yml
      parameters:
        label: 'RUST-UBUSLIM x64 (current production image)'

  - ${{ if eq(parameters.runHostBringUp, true) }}:
    - job: HostBringUp_AZL3
      displayName: 'Bring-up: run install-dependencies on AZL3 (failures are the point)'
      pool:
        name: $(x64Pool)
        demands:
          - imageOverride -equals RUST-AZL3
      steps:
      - checkout: self
      # Each step continues on error so one failure does not mask the rest: the
      # goal is a complete list of what needs porting, not a fast exit.
      - template: templates/install-dependencies.yml
        parameters:
          osType: Linux
