# Batch handling, scripting variables and colon commands.

[[case]]
name = "two batches separated by go"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = "SELECT 1 AS a\nGO\nSELECT 2 AS b\nGO\n" }

[[case]]
name = "go with a repeat count"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = "SELECT 7 AS a\nGO 3\n" }

[[case]]
name = "go is case insensitive and may be indented"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = "SELECT 1 AS a\n   go   \n" }

[[case]]
name = "a trailing batch with no terminator still runs"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = "SELECT 1 AS a\n" }

[[case]]
name = "go inside a string literal is not a terminator"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = "SELECT '\nGO\n' AS a\nGO\n" }

[[case]]
name = "go inside a block comment is not a terminator"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = "/*\nGO\n*/\nSELECT 1 AS a\nGO\n" }

[[case]]
name = "a line comment does not swallow the next line"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = "-- comment 'unclosed\nSELECT 1 AS a\nGO\n" }

[[case]]
name = "variable substitution from the command line"
connect = true
args = ["-C", "-v", "N=42", "-i", "in.sql"]
files = { "in.sql" = "SELECT $(N) AS a\nGO\n" }

[[case]]
name = "setvar then use"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = ":setvar N 5\nSELECT $(N) AS a\nGO\n" }

[[case]]
name = "substitution happens inside a string literal"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = ":setvar N abc\nSELECT '$(N)' AS a\nGO\n" }

[[case]]
name = "an undefined variable is reported"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = "SELECT $(nope) AS a\nGO\n" }

[[case]]
name = "assigning a read only variable is refused"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = ":setvar SQLCMDSERVER other\n" }

[[case]]
name = "disabling substitution leaves the reference alone"
connect = true
args = ["-C", "-x", "-i", "in.sql"]
files = { "in.sql" = "SELECT 1 AS [$(nope)]\nGO\n" }

[[case]]
name = "reset discards the statement cache"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = "SELECT 1 AS a\n:reset\nSELECT 2 AS b\nGO\n" }

[[case]]
name = "read a file into the statement cache"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = ":r other.sql\nGO\n", "other.sql" = "SELECT 9 AS a\n" }

[[case]]
name = "reading a file that is not there"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = ":r missing.sql\nGO\n" }

[[case]]
name = "an unknown colon command"
connect = true
args = ["-C", "-i", "in.sql"]
files = { "in.sql" = ":nonsense\n" }

[[case]]
name = "echo the input back"
connect = true
args = ["-C", "-e", "-i", "in.sql"]
files = { "in.sql" = "SELECT 1 AS a\nGO\n" }

[[case]]
name = "input arrives on stdin"
connect = true
args = ["-C"]
stdin = "SELECT 1 AS a\nGO\n"

[[case]]
name = "two input files run in order"
connect = true
args = ["-C", "-i", "one.sql", "-i", "two.sql"]
files = { "one.sql" = "SELECT 1 AS a\nGO\n", "two.sql" = "SELECT 2 AS b\nGO\n" }

[[case]]
name = "an input file that is not there"
connect = true
args = ["-C", "-i", "missing.sql"]
