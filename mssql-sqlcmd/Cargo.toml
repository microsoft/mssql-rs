[package]
name = "mssql-sqlcmd"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false
description = "sqlcmd components in Rust, linked into native sqlcmd through a C ABI"

[lib]
# `staticlib` is what native sqlcmd links; `rlib` lets the crate's own tests
# and other workspace crates use it as an ordinary dependency.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

[lints]
workspace = true

# diagnostics: connects with mssql-tds and times its connect stages from the
# spans it opens. mssql-tds is 64-bit only, so 32-bit builds (win-x86) leave
# diagnostics out; mssql_sqlcmd_diagnostics_run reports it as unsupported there.
[target.'cfg(target_pointer_width = "64")'.dependencies]
mssql-tds = { path = "../mssql-tds" }
tokio = { version = "1.48.0", features = ["rt", "net", "time", "macros", "sync"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["registry", "std"] }

# diagnostics: the client's operating-system version and, off Windows, the
# Kerberos ticket cache of the user.
[target.'cfg(all(target_pointer_width = "64", unix))'.dependencies]
libc = "0.2"

[target.'cfg(all(target_pointer_width = "64", windows))'.dependencies]
windows-sys = { version = "0.59", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_System_SystemInformation"] }
