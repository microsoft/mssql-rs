[package]
name = "mssql-sqlcmd"
version = "0.1.0"
edition = "2024"
publish = false
description = "sqlcmd components in Rust, linked into native sqlcmd through a C ABI"

[lib]
# `staticlib` is what native sqlcmd links; `rlib` lets the crate's own tests
# and other workspace crates use it as an ordinary dependency.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
